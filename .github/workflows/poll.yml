name: poll-tfl
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; real runs may be delayed)
  workflow_dispatch: {}      # lets you start it manually from the Actions tab
permissions:
  contents: write
concurrency:
  group: poll-tfl
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python step2_poll_tfl.py --once
      - name: Commit data if changed
        run: |
          git config user.name "poller"
          git config user.email "poller@users.noreply.github.com"
          git add disruptions.db disruptions.csv
          git diff --cached --quiet || (git commit -m "update disruptions" && git push)
