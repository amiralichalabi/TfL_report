name: poll-tfl
# One run polls TfL every 2 minutes for ~5h40m, then starts the next run itself.
# The cron line is only a safety net that restarts the chain if it ever breaks.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */3 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: poll-tfl
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Poll every 2 minutes
        run: |
          git config user.name "poller"
          git config user.email "poller@users.noreply.github.com"
          END=$((SECONDS + 20400))
          while [ $SECONDS -lt $END ]; do
            python step2_poll_tfl.py --once || echo "poll failed, will retry"
            git add disruptions.db disruptions.csv
            if ! git diff --cached --quiet; then
              git commit -qm "update disruptions"
              git pull -q --rebase --autostash || true
              git push -q || echo "push failed, will retry next round"
            fi
            sleep 120
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --repo "$GITHUB_REPOSITORY"
